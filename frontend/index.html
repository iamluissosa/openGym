<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>balackGym</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#0c0e12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="balackGym">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<script>
  (function() {
    try {
      // Si la URL actual termina en /demo sin barra diagonal final, ajustar la base para que los assets relativos resuelvan en /demo/
      if (location.pathname.endsWith('/demo')) {
        var base = document.createElement('base');
        base.href = location.pathname + '/';
        document.head.appendChild(base);
      }
    } catch (e) {}
  })();
</script>
</head>
<body style="margin:0;padding:0;background:#0c0e12;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;">
<div id="root">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0c0e12;color:#8e8e93;gap:16px;">
    <img src="icon-180.png" alt="balackGym" width="64" height="64" style="object-fit:contain;filter:drop-shadow(0 4px 14px rgba(48,209,88,.25));">
    <div style="width:28px;height:28px;border:3px solid #232730;border-top-color:#30d158;border-radius:50%;animation:bgSpin .8s linear infinite;"></div>
    <style>@keyframes bgSpin{to{transform:rotate(360deg)}}</style>
  </div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
